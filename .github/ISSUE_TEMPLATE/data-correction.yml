name: Data correction
description: Report a circuit, viewing-zone or provenance correction
title: "[Data] "
labels: ["data"]
body:
  - type: input
    id: circuit
    attributes:
      label: Circuit
    validations:
      required: true
  - type: input
    id: season
    attributes:
      label: Applicable season
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: File and field
      placeholder: data/viewing-zones/suzuka.json · grandstands[...].features.roof
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Current and proposed value
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence links and uncertainty
      description: Link to sources; do not upload copyrighted maps or ticketing PDFs.
    validations:
      required: true
